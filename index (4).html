<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VORTEX · Limpieza precisa</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#2b2b2b;--mut:#666;--line:#d9dde0;--in:#009cdd;--out:#d9480f;--pay:#6741d9;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#272727;--card:#393939;--ink:#ededed;--mut:#a8a8a8;--line:#4d4d4d;--in:#2bb4ee;--out:#ff8c5a;--pay:#a48bff;--ok:#62d07a}}
:root[data-theme="dark"]{--bg:#272727;--card:#393939;--ink:#ededed;--mut:#a8a8a8;--line:#4d4d4d;--in:#2bb4ee;--out:#ff8c5a;--pay:#a48bff;--ok:#62d07a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,.big{font-family:"Barlow Condensed",Impact,sans-serif;letter-spacing:.2px}
header{background:#393939;color:#ededed;border-bottom:4px solid #009cdd;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header img{height:52px;max-width:70vw;display:block}
header input{background:#ffffff1a;color:#fff;border:1px solid #ffffff44;border-radius:6px;padding:6px 8px}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 0;background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
nav button{border:0;background:none;color:var(--mut);font:600 15px Barlow,sans-serif;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--in)}
main{max-width:960px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.big{font-size:34px;font-weight:700;line-height:1.1}
.mut{color:var(--mut);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}.pay{color:var(--pay)}
.bar{height:8px;border-radius:4px;background:var(--line);margin:4px 0 12px;overflow:hidden}.bar i{display:block;height:100%}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
input,select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--in);outline-offset:1px}
.btn{background:var(--in);color:#fff;border:0;border-radius:6px;padding:10px 16px;font:600 15px Barlow,sans-serif;cursor:pointer}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--out);cursor:pointer;font-size:18px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid currentColor}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
h2{margin:0 0 10px;font-size:22px}
.hbs{display:flex;gap:8px}
.hb{background:none;color:#ededed;border:1px solid #ffffff66;border-radius:6px;padding:8px 12px;font:600 14px Barlow,sans-serif;cursor:pointer}
.hb:hover{background:#009cdd;border-color:#009cdd}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(920px,96vw);max-height:90vh;padding:0;overflow:auto}
dialog::backdrop{background:#000a}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:3px solid var(--in);position:sticky;top:0;background:var(--card);z-index:1}
.dh h2{margin:0;font-size:26px}
#db{padding:16px 18px 20px}
.bars{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.b{flex:1;min-width:24px;height:170px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px}
.b i{display:block;width:72%;background:var(--mut);opacity:.45;border-radius:3px 3px 0 0;min-height:2px}
.b i.top{background:var(--in);opacity:1}
.b em{font-style:normal;color:var(--mut);margin-top:3px}
.b span{color:var(--mut);margin-bottom:2px;white-space:nowrap}
tr.sel td{background:color-mix(in srgb,var(--in) 14%,transparent)}
tr.clk{cursor:pointer}
</style>
</head>

 return `<tr><td><b>${esc(n)}</b></td><td><select onchange="setWc(${i},'tipo',this.value)"><option value="pct" ${f?'':'selected'}>Por porcentaje de servicios</option><option value="fijo" ${f?'selected':''}>Sueldo fijo</option></select></td><td>${f?`<input type="number" min="0" value="${c.sueldo||0}" style="width:150px" aria-label="Sueldo mensual" onchange="setWc(${i},'sueldo',+this.value)"> por mes`:`<input type="number" min="0" max="100" value="${c.pct??S.pct}" style="width:90px" aria-label="Porcentaje" onchange="setWc(${i},'pct',+this.value)"> %`}</td><td class="mut">${f?'2 pagos: día 1 y día 15':'Sobre cada servicio que haga'}</td></tr>`}).join('')}</table></div><p class="mut">Cambia aquí cómo se le paga a cada persona. Al cambiarlo, el Resumen y las tarjetas se recalculan solos.</p></div>`}
function wcUI(i){const c=wc(i),f=c.tipo=='fijo';return `<select onchange="setWc(${i},'tipo',this.value)" style="width:auto"><option value="pct" ${f?'':'selected'}>% de servicios</option><option value="fijo" ${f?'selected':''}>Sueldo fijo</option></select>`+(f?`<input type="number" min="0" value="${c.sueldo||0}" style="width:140px" aria-label="Sueldo mensual" onchange="setWc(${i},'sueldo',+this.value)"><span class="mut">/mes · pagos día 1 y 15</span>`:`<input type="number" min="0" max="100" value="${c.pct??S.pct}" style="width:80px" aria-label="Porcentaje" onchange="setWc(${i},'pct',+this.value)"><span class="mut">%</span>`)}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function pk(p){return {Transferencia:'Llave Breve',Tarjeta:'Datáfono'}[p]||p}
function mv(t){const a=t.total;if(t.kind=='traslado')return[[t.po,-a],[t.pd,a]];if(t.kind=='servicio'||t.kind=='producto'||t.kind=='prestamo')return[[pk(t.pm),a]];return[[pk(t.pm),-a]]}
function bolsillos(){
 const cur=$('#mes').value,st={};POCK.forEach(p=>st[p]={i:+(S.ini&&S.ini[p])||0,e:0,s:0,me:0,ms:0});
 S.tx.forEach(t=>mv(t).forEach(([p,a])=>{const o=st[p];if(!o)return;const m=t.date.startsWith(cur);if(a>0){o.e+=a;if(m)o.me+=a}else{o.s-=a;if(m)o.ms-=a}}));
 const tot=POCK.reduce((x,p)=>x+st[p].i+st[p].e-st[p].s,0);
 return `<div class="card" style="margin-top:12px"><h2>Bolsillos · total ${fmt(tot)}</h2><div class="grid">${POCK.map(p=>{const o=st[p],sd=o.i+o.e-o.s;return `<div class="card"><div class="mut">${p}</div><div class="big" style="color:var(${sd>=0?'--in':'--out'})">${fmt(sd)}</div><div class="mut">Mes: <span class="in">+${fmt(o.me)}</span> · <span class="out">−${fmt(o.ms)}</span></div><label style="margin-top:8px">Saldo inicial<input type="number" value="${o.i}" onchange="S.ini=S.ini||{};S.ini['${p}']=+this.value||0;save();render()"></label></div>`}).join('')}</div><p class="mut">El saldo es acumulado. Las ventas entran al bolsillo con el que se pagó; gastos, nómina y pagos a trabajadores salen del bolsillo elegido. Usa Traslado para mover plata entre bolsillos, por ejemplo al consignar efectivo.</p></div>`}
function periodos(){
 const dt=new Date(hoy+'T00:00'),a=new Date(dt);a.setDate(dt.getDate()-(dt.getDay()+6)%7);const b=new Date(a);b.setDate(a.getDate()+6);
 const mm=$('#mes').value;const P=[['Hoy',S.tx.filter(t=>t.date==hoy),hoy,hoy],['Esta semana (lun–dom)',S.tx.filter(t=>t.date>=iso(a)&&t.date<=iso(b)),iso(a),iso(b)],['Mes '+mm,mes(),mm+'-01',mm+'-31']];
 return `<div class="card" style="margin-top:12px"><h2>Lo que me queda</h2><div class="wrap"><table><tr><th>Periodo</th><th class="n">Ingresos</th><th class="n">Pago trabajadores</th><th class="n">Gastos y nómina</th><th class="n">Ganancia</th></tr>${P.map(([l,x,f,t])=>{const g=gan(x,f,t);return `<tr><td><b>${l}</b></td><td class="n in">${fmt(sum(x,['servicio','producto']))}</td><td class="n pay">${fmt(com(x)+fijoEn(f,t))}</td><td class="n out">${fmt(sum(x,['gasto','nomina']))}</td><td class="n"><b style="color:var(${g>=0?'--ok':'--out'})">${fmt(g)}</b></td></tr>`}).join('')}</table></div><p class="mut">Ganancia = ingresos − pago a trabajadores − gastos − nómina. El pago a trabajadores (porcentaje de los servicios y sueldos fijos los días 1 y 15) se calcula solo; no lo registres también en Nómina.</p></div>`}

function render(){
 $('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('');
 $('#app').innerHTML=({resumen,registrar,equipo,movimientos,cierre,prestamos,inventario,catalogo,respaldo})[tab]();
 if(tab=='registrar')campos();
}
function resumen(){
 const mm=$('#mes').value,m=mes(),ing=sum(m,['servicio','producto']),gas=sum(m,['gasto']),nom=sum(m,['nomina']),cm=com(m)+fijoEn(mm+'-01',mm+'-31'),net=gan(m,mm+'-01',mm+'-31');
 const cats={};m.filter(t=>t.kind=='gasto').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.total);
 const max=Math.max(1,...Object.values(cats));
 return `<div class="grid">
 <div class="card"><div class="mut">Ingresos</div><div class="big in">${fmt(ing)}</div><div class="mut">Servicios ${fmt(sum(m,['servicio']))}<br>Productos ${fmt(sum(m,['producto']))}</div></div>
 <div class="card"><div class="mut">Gastos</div><div class="big out">${fmt(gas)}</div></div>
 <div class="card"><div class="mut">Nómina</div><div class="big pay">${fmt(nom)}</div></div>
 <div class="card"><div class="mut">Pago trabajadores</div><div class="big pay">${fmt(cm)}</div></div>
 ${kpiIns()}<div class="card"><div class="mut">Ganancia del mes</div><div class="big" style="color:var(${net>=0?'--ok':'--out'})">${fmt(net)}</div></div>
 </div>
 <div class="card" style="margin-top:12px"><h2>Insumos · días que alcanzan</h2>${graficaIns()}</div>
 ${bolsillos()}
 ${periodos()}
 <div class="card" style="margin-top:12px"><h2>Gastos por categoría</h2>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div>${esc(c)} <b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/max*100}%;background:var(--out)"></i></div>`).join(''):'<p class="mut">Sin gastos este mes. Registra el primero en la pestaña Registrar.</p>'}</div>`;
}
function registrar(){
 return `<div class="card"><h2>Nuevo movimiento</h2><form onsubmit="event.preventDefault();guardar()">
 <label>Tipo<select id="kind" onchange="campos()">${Object.entries(KINDS).filter(([k])=>k!='prestamo'&&k!='abono').map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label>
 <label>Fecha<input type="date" id="date" value="${hoy}" required></label>
 <span id="dyn" style="display:contents"></span>
 <label>Cantidad<input type="number" id="qty" value="1" min="1" oninput="calc()"></label>
 <label>Valor unitario<input type="number" id="val" min="0" required oninput="calc()"></label>
 <label id="lpm">Bolsillo<select id="pm">${POCK.map(p=>`<option>${p}</option>`).join('')}</select></label>
 <div class="full"><div class="mut">Total</div><div class="big" id="tot">${fmt(0)}</div></div>
 <div class="full"><button class="btn">Guardar movimiento</button></div></form></div>`;
}
function campos(){
 const k=$('#kind').value,d=$('#dyn');$('#lpm').style.display=k=='traslado'?'none':'';
 if(k=='servicio'||k=='producto'){const l=S.cat.filter(c=>c.kind==k);d.innerHTML=`<label>${KINDS[k][0]}<select id="item" onchange="precio()">${l.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')||'<option value="">Sin ítems: agrégalos en Catálogo</option>'}</select></label><label>Trabajador<select id="w">${wopts()}</select></label><label>Nota (placa, cliente)<input id="note"></label>`;precio()}
 else if(k=='traslado'){const o=POCK.map(p=>`<option>${p}</option>`).join('');d.innerHTML=`<label>Sale de<select id="po">${o}</select></label><label>Entra a<select id="pd">${o}</select></label><label>Nota<input id="note"></label>`;$('#pd').selectedIndex=1;$('#val').value='';calc()}
 else if(k=='pagocom'){d.innerHTML=`<label>Trabajador<select id="w">${wopts()}</select></label><label>Nota<input id="note"></label>`;$('#val').value='';calc()}
 else if(k=='gasto'){d.innerHTML=`<label>Categoría<select id="cat">${GASTOS.map(g=>`<option>${g}</option>`).join('')}</select></label><label>Detalle<input id="note" required></label>`;$('#val').value='';calc()}
 else{d.innerHTML=`<label>Empleado<input id="note" required></label><label>Concepto<select id="cat"><option>Salario</option><option>Bono</option><option>Prestaciones</option><option>Seguridad social</option><option>Adelanto</option></select></label>`;$('#val').value='';calc()}
}
function precio(){const c=S.cat.find(c=>c.id==$('#item')?.value);$('#val').value=c?c.price:'';calc()}
function calc(){$('#tot').textContent=fmt(($('#qty').value||0)*($('#val').value||0))}
function guardar(){
 const k=$('#kind').value,q=+$('#qty').value,v=+$('#val').value,it=S.cat.find(c=>c.id==$('#item')?.value);
 if((k=='servicio'||k=='producto')&&!it)return alert('Agrega primero un ítem en el Catálogo.');
 const tr=k=='traslado',pc=k=='pagocom';if(tr&&$('#po').value==$('#pd').value)return alert('El origen y el destino deben ser distintos.');
 S.tx.push({id:Date.now(),date:$('#date').value,kind:k,cat:tr?$('#po').value+' → '+$('#pd').value:pc?'Pago comisión':k=='servicio'||k=='producto'?it.name:$('#cat').value,note:$('#note')?$('#note').value:'',w:k=='servicio'||k=='producto'||pc?+$('#w').value:null,qty:q,val:v,total:q*v,pm:tr?$('#po').value:$('#pm').value,po:tr?$('#po').value:undefined,pd:tr?$('#pd').value:undefined});
 save();tab='movimientos';render();
}
function equipo(){
 const m=mes().filter(t=>t.w!=null&&t.kind!='pagocom'),ids=S.workers.map((n,i)=>i),vis=ids.filter(i=>!S.wOff[i]||m.some(x=>x.w==i));
 return `${wcTabla()}<div class="card" style="margin-top:12px"><h2>Trabajadores</h2>
 ${S.workers.map((n,i)=>`<div class="row" style="align-items:center"><input value="${esc(n)}" maxlength="30" style="max-width:240px" ${S.wOff[i]?'disabled':''} onchange="S.workers[${i}]=this.value.trim()||'Trabajador ${i+1}';save();render()">${S.wOff[i]?`<span class="mut">Retirado</span><button class="btn g" onclick="reactivar(${i})">Reactivar</button>`:`<button class="btn g" onclick="quitarW(${i})">Quitar</button>`}</div>`).join('')}
 <div class="row"><input id="nw" placeholder="Nombre del nuevo trabajador" maxlength="30" style="max-width:240px"><button class="btn" onclick="addW()">Agregar trabajador</button></div>
 <label style="max-width:200px">Porcentaje por defecto (%)<input type="number" min="0" max="100" value="${S.pct}" onchange="S.pct=Math.min(100,Math.max(0,+this.value||0));save();render()"></label>
 <p class="mut">Al quitar un trabajador se conserva su historial; ya no aparece para registrar nuevas ventas.</p></div>
 <div class="grid" style="margin-top:12px">${vis.map(i=>{const pg=mes().filter(x=>x.kind=='pagocom'&&x.w==i).reduce((a,x)=>a+x.total,0),t=m.filter(x=>x.w==i),sv=t.filter(x=>x.kind=='servicio'),by={};t.forEach(x=>{by[x.cat]=by[x.cat]||{q:0,v:0};by[x.cat].q+=x.qty;by[x.cat].v+=x.total});const st=sv.reduce((a,x)=>a+x.total,0),c=wc(i),due=c.tipo=='fijo'?{l:'Sueldo fijo (día 1 y 15)',v:c.sueldo||0}:{l:'Pago '+(c.pct??S.pct)+'%',v:st*(c.pct??S.pct)/100};
 return `<div class="card"><h2>${esc(S.workers[i])}${S.wOff[i]?' (retirado)':''}</h2><div class="big in">${fmt(t.reduce((a,x)=>a+x.total,0))}</div><div class="mut">${sv.reduce((a,x)=>a+x.qty,0)} servicios · ${fmt(st)}</div><div>${due.l}: <b class="pay">${fmt(due.v)}</b></div><div>Pagado: <b>${fmt(pg)}</b> · Pendiente: <b class="out">${fmt(due.v-pg)}</b></div>${c.tipo=='fijo'&&!S.wOff[i]?`<div class="mut">Próximo pago: ${proxPago()} · ${fmt((c.sueldo||0)/2)}</div>`:''}<div style="margin-top:10px">${Object.entries(by).map(([c,o])=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(c)} × ${o.q}</span><b>${fmt(o.v)}</b></div>`).join('')||'<p class="mut">Sin ventas este mes.</p>'}</div></div>`}).join('')}</div>`;
}
function wopts(){return S.workers.map((n,i)=>S.wOff[i]?'':`<option value="${i}">${esc(n)}</option>`).join('')}
function addW(){const n=$('#nw').value.trim();if(!n)return;S.workers.push(n);save();render()}
async function quitarW(i){if(!await pedirClave('Quitar a '+S.workers[i]+' del equipo'))return;S.wOff[i]=true;save();render()}
function reactivar(i){delete S.wOff[i];save();render()}
async function delCat(id){if(!await pedirClave('Eliminar del catálogo'))return;S.cat=S.cat.filter(x=>x.id!=id);save();render()}
function pedirClave(msg){
 return new Promise(res=>{
  if(!sb){res(confirm(msg+'. ¿Continuar?'));return}
  const d=$('#pw');$('#pwm').textContent=msg;$('#pwi').value='';$('#pwe').textContent='';
  d._res=res;d.onclose=()=>{if(d._res){const f=d._res;d._res=null;f(false)}};
  d.showModal();$('#pwi').focus();
 });
}
async function pwOk(){
 const d=$('#pw'),btn=d.querySelector('.btn');btn.disabled=true;
 try{
  const {data}=await sb.auth.getSession(),em=data.session&&data.session.user.email;
  const v=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const {error}=await v.auth.signInWithPassword({email:em,password:$('#pwi').value});
  if(error){$('#pwe').textContent='Clave incorrecta.';return}
  const f=d._res;d._res=null;d.close();f&&f(true);
 }catch(e){$('#pwe').textContent='No se pudo verificar la clave. Revisa tu conexión.'}
 finally{btn.disabled=false}
}
function dd(n){const d=new Date(hoy+'T00:00');d.setDate(d.getDate()-n);return iso(d)}
function consumo(a,b){const r={};S.tx.filter(t=>t.kind=='servicio'&&t.date>=a&&t.date<=b).forEach(t=>{const c=S.cat.find(c=>c.kind=='servicio'&&c.name==t.cat),rc=c&&S.rec[c.id];if(rc)for(const k in rc)r[k]=(r[k]||0)+rc[k]*t.qty});return r}
const imSum=(i,a,b,ty)=>S.im.filter(m=>m.ins==i.id&&m.date>=a&&m.date<=b&&(!ty||m.type==ty)).reduce((s,m)=>s+m.ml,0);
const stockOf=i=>i.ini+imSum(i,'0000','9999')-(consumo(i.d,'9999')[i.id]||0);
function inventario(){
 const mm=$('#mes').value,a=mm+'-01',b=mm+'-31',c30=consumo(dd(29),hoy),cm=consumo(a,b);
 const motos=mes().filter(t=>t.kind=='servicio').reduce((s,t)=>s+t.qty,0);
 const sv=S.cat.filter(c=>c.kind=='servicio'),pm=pmax();
 const opt=S.ins.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');
 const fila=i=>{const st=stockOf(i),dias=Math.min(30,Math.max(1,Math.round((new Date(hoy)-new Date(i.d))/864e5)+1)),gd=((c30[i.id]||0)-imSum(i,dd(29),hoy,'ajuste'))/dias,rest=gd>0?st/gd:null,col=rest==null?'--mut':rest<7?'--out':rest<15?'--pay':'--ok';
  return `<tr><td><b>${esc(i.name)}</b></td><td class="n">${Math.round(st)} ml</td><td class="n">${Math.round(gd)} ml</td><td class="n" style="color:var(${col})"><b>${rest==null?'Sin consumo':Math.round(rest)+' días'}</b></td><td class="n">${fmt(i.cpm*1000)} /L</td><td><button class="x" aria-label="Eliminar" onclick="delIns(${i.id})">×</button></td></tr>`};
 const op=i=>{const t=cm[i.id]||0,mer=-imSum(i,a,b,'ajuste'),dv=t>0?mer/t*100:0;
  return `<tr><td><b>${esc(i.name)}</b></td><td class="n">${Math.round(t)}</td><td class="n" style="color:var(${mer>0?'--out':'--ok'})">${Math.round(mer)}</td><td class="n">${motos?(t/motos).toFixed(1):'—'}</td><td class="n"><b>${motos?((t+mer)/motos).toFixed(1):'—'}</b></td><td class="n" style="color:var(${dv>10?'--out':'--ok'})">${t?dv.toFixed(0)+'%':'—'}</td></tr>`};
 return `<div class="card"><h2>Insumos y stock</h2>${S.ins.length?`<div class="wrap"><table><tr><th>Insumo</th><th class="n">Stock</th><th class="n">Gasto/día (30 d)</th><th class="n">Alcanza para</th><th class="n">Costo</th><th></th></tr>${S.ins.map(fila).join('')}</table></div><p class="mut">El stock baja solo al registrar servicios, según el consumo por servicio. Rojo: menos de 7 días. Morado: menos de 15.</p>`:'<p class="mut">Aún no hay insumos. Agrega el primero abajo (shampoo, desengrasante, cera...).</p>'}</div>
 <div class="grid" style="margin-top:12px">
 <div class="card"><h2>Nuevo insumo</h2><form onsubmit="event.preventDefault();addIns()"><label>Nombre<input id="in" required></label><label>ml por envase<input id="ie" type="number" min="1" required></label><label>Precio del envase<input id="ip" type="number" min="0" required></label><label>Stock actual (ml)<input id="is" type="number" min="0" value="0" required></label><div class="full"><button class="btn">Agregar insumo</button></div></form></div>
 <div class="card"><h2>Registrar compra</h2><form onsubmit="event.preventDefault();compra()"><label>Insumo<select id="ci">${opt}</select></label><label>Fecha<input id="cd" type="date" value="${hoy}" required></label><label>Envases comprados<input id="cn" type="number" min="1" required></label><label>Precio total<input id="cp" type="number" min="0" required></label><label>Bolsillo<select id="cb">${POCK.map(p=>`<option>${p}</option>`).join('')}</select></label><label style="flex-direction:row;align-items:center;gap:8px"><input id="cg" type="checkbox" checked style="width:auto">Registrar también como gasto</label><div class="full"><button class="btn">Guardar compra</button></div></form></div>
 <div class="card"><h2>Conteo físico</h2><p class="mut">Mide cuánto queda realmente. La diferencia con el stock calculado se registra como merma o desperdicio.</p><form onsubmit="event.preventDefault();ajuste()"><label>Insumo<select id="ai">${opt}</select></label><label>ml que quedan<input id="am" type="number" min="0" required></label><div class="full"><button class="btn g">Registrar conteo</button></div></form></div></div>
 <div class="card" style="margin-top:12px"><h2>Consumo por servicio (ml por moto)</h2>${S.ins.length&&sv.length?`<div class="wrap"><table><tr><th>Servicio</th>${S.ins.map(i=>`<th class="n">${esc(i.name)}</th>`).join('')}<th class="n">Costo insumos</th><th class="n">Margen tras pago ${pm}%</th></tr>${sv.map(c=>{const rc=S.rec[c.id]||{},co=S.ins.reduce((x,i)=>x+(rc[i.id]||0)*i.cpm,0),mg=c.price-co-c.price*pm/100;return `<tr><td><b>${esc(c.name)}</b><div class="mut">${fmt(c.price)}</div></td>${S.ins.map(i=>`<td class="n"><input type="number" min="0" step="any" style="width:80px" value="${rc[i.id]??''}" onchange="setRec(${c.id},${i.id},this.value)"></td>`).join('')}<td class="n out">${fmt(co)}</td><td class="n"><b style="color:var(${mg>=0?'--ok':'--out'})">${fmt(mg)}</b></td></tr>`}).join('')}</table></div><p class="mut">Escribe cuántos ml gasta cada servicio de cada insumo. Con eso se descuenta el stock y se calcula el costo real por lavada.</p>`:'<p class="mut">Agrega insumos y servicios en el catálogo para definir el consumo.</p>'}</div>
 <div class="card" style="margin-top:12px"><h2>Optimización por moto · ${mm}</h2><p class="mut">${motos} motos lavadas en el mes.</p>${S.ins.length?`<div class="wrap"><table><tr><th>Insumo</th><th class="n">Consumo estándar (ml)</th><th class="n">Merma (ml)</th><th class="n">ml/moto estándar</th><th class="n">ml/moto real</th><th class="n">Desvío</th></tr>${S.ins.map(op).join('')}</table></div><p class="mut">Desvío = merma sobre el consumo estándar. Si pasa de 10% (rojo), se está gastando más de lo definido: revisa la dosis o el desperdicio.</p>`:''}</div>`;
}
function addIns(){const e=+$('#ie').value,pr=+$('#ip').value;S.ins.push({id:Date.now(),name:$('#in').value.trim(),env:e,cpm:pr/e,ini:+$('#is').value,d:hoy});save();render()}
function compra(){const i=S.ins.find(x=>x.id==$('#ci').value);if(!i)return alert('Primero agrega un insumo.');const n=+$('#cn').value,pr=+$('#cp').value,ml=n*i.env,d=$('#cd').value;
 S.im.push({id:Date.now(),date:d,ins:i.id,type:'compra',ml,cost:pr});if(pr>0&&ml>0)i.cpm=pr/ml;
 if($('#cg').checked&&pr>0)S.tx.push({id:Date.now()+1,date:d,kind:'gasto',cat:'Insumos de lavado',note:i.name+' x'+n,w:null,qty:1,val:pr,total:pr,pm:$('#cb').value});
 save();render()}

let cdia=hoy;
const dayTx=d=>S.tx.filter(t=>t.date==d);
const quick=d=>{const x=dayTx(d);return{n:x.length,ing:sum(x,['servicio','producto']),sal:sum(x,['gasto','nomina','pagocom'])}};
const difC=c=>POCK.reduce((a,p)=>a+(c.cont&&c.cont[p]!=null?c.cont[p]-c.esp[p]:0),0);

function flujo(d){const r={};POCK.forEach(p=>r[p]={ini:+(S.ini&&S.ini[p])||0,e:0,s:0,t:0});
 S.tx.forEach(t=>mv(t).forEach(([p,a])=>{const o=r[p];if(!o)return;if(t.date<d)o.ini+=a;else if(t.date==d){if(t.kind=='traslado')o.t+=a;else if(a>0)o.e+=a;else o.s-=a}}));return r}
function resDia(d){const x=dayTx(d),q=quick(d);return Object.assign({f:flujo(d),neto:q.ing-q.sal,sv:sum(x,['servicio']),pr:sum(x,['producto']),gas:sum(x,['gasto']),nom:sum(x,['nomina']),pag:sum(x,['pagocom']),pre:sum(x,['prestamo']),abo:sum(x,['abono']),motos:x.filter(t=>t.kind=='servicio').reduce((a,t)=>a+t.qty,0)},q)}

function cierre(){

 const pend=[...new Set(S.tx.map(t=>t.date))].filter(f=>!S.cierres.some(c=>c.date==f)).sort().reverse().slice(0,10);
 const camb=ci&&(ci.ing!==r.ing||ci.sal!==r.sal||ci.n!==r.n);
 const wk=S.workers.map((n,i)=>{const t=x.filter(y=>y.w===i&&(y.kind=='servicio'||y.kind=='producto'));return t.length?`<tr><td>${esc(n)}</td><td class="n">${t.filter(y=>y.kind=='servicio').reduce((a,y)=>a+y.qty,0)}</td><td class="n">${fmt(t.reduce((a,y)=>a+y.total,0))}</td><td class="n pay">${wc(i).tipo=='fijo'?'Sueldo fijo':fmt(com(t))}</td></tr>`:''}).join('');
 return `<div class="card"><h2>Cierre de caja</h2>
 <div class="row" style="align-items:center"><button class="btn g" onclick="movDia(-1)" aria-label="Día anterior">‹</button><input type="date" value="${d}" style="width:auto" onchange="cdia=this.value||hoy;render()"><button class="btn g" onclick="movDia(1)" aria-label="Día siguiente">›</button><button class="btn g" onclick="verDia(hoy)">Hoy</button></div>
 ${pend.length?`<div class="mut">Días con movimientos sin cerrar:</div><div class="row">${pend.map(f=>`<button class="btn g" style="padding:4px 10px" onclick="verDia('${f}')">${f}${f==hoy?' (hoy)':''}</button>`).join('')}</div>`:'<p class="mut">No hay días pendientes de cierre.</p>'}</div>
 <div class="grid" style="margin-top:12px"><div class="card"><div class="mut">Entradas</div><div class="big in">${fmt(r.ing)}</div><div class="mut">Servicios ${fmt(r.sv)} · Productos ${fmt(r.pr)}${r.pre?` · Préstamos ${fmt(r.pre)}`:''}<br>${r.motos} motos · ${r.n} movimientos</div></div>
 <div class="card"><div class="mut">Salidas</div><div class="big out">${fmt(r.sal)}</div><div class="mut">Gastos ${fmt(r.gas)} · Nómina ${fmt(r.nom)}<br>Pagos a trabajadores ${fmt(r.pag)}${r.abo?` · Abonos a préstamos ${fmt(r.abo)}`:''}</div></div>
 <div class="card"><div class="mut">Neto de caja del día</div><div class="big" style="color:var(${r.neto>=0?'--ok':'--out'})">${fmt(r.neto)}</div></div></div>
 ${ci?`<div class="card" style="margin-top:12px;border-color:var(--ok)"><h2>Caja cerrada ${estado(ci)}</h2><div class="mut">Cerrada el ${new Date(ci.ts).toLocaleString('es',{dateStyle:'medium',timeStyle:'short'})}</div>${POCK.map(p=>`<div>${p}: esperado <b>${fmt(ci.esp[p])}</b>${ci.cont&&ci.cont[p]!=null?` · contado <b>${fmt(ci.cont[p])}</b> · diferencia <b style="color:var(${ci.cont[p]-ci.esp[p]==0?'--ok':'--out'})">${fmt(ci.cont[p]-ci.esp[p])}</b>`:''}</div>`).join('')}${ci.nota?`<p>Nota: ${esc(ci.nota)}</p>`:''}${camb?'<p class="out"><b>⚠ Hay movimientos distintos a los del cierre.</b> Se agregaron o eliminaron registros de este día después de cerrar.</p>':''}<div class="row"><button class="btn g" onclick="anular(${ci.id})">Anular cierre</button></div></div>`:''}
 <div class="card" style="margin-top:12px"><h2>Bolsillos del día</h2><div class="wrap"><table><tr><th>Bolsillo</th><th class="n">Saldo inicial</th><th class="n">Entradas</th><th class="n">Salidas</th><th class="n">Traslados</th><th class="n">Saldo esperado</th><th class="n">${ci?'Contado':'Contado real'}</th></tr>
 ${POCK.map((p,k)=>{const o=r.f[p];return `<tr><td><b>${p}</b></td><td class="n">${fmt(o.ini)}</td><td class="n in">${fmt(o.e)}</td><td class="n out">${fmt(o.s)}</td><td class="n">${fmt(o.t)}</td><td class="n"><b>${fmt(esp(p))}</b></td><td class="n">${ci?(ci.cont&&ci.cont[p]!=null?fmt(ci.cont[p]):'—'):`<input id="ct${k}" type="number" min="0" style="width:130px" placeholder="Opcional">`}</td></tr>`}).join('')}</table></div>
 ${ci?'':`<p class="mut">Cuenta lo que hay realmente en cada bolsillo y escríbelo; la diferencia con el saldo esperado queda registrada. Si no cuentas alguno, déjalo vacío.</p><div class="row"><input id="cnota" placeholder="Nota del cierre (opcional)" maxlength="120" style="max-width:360px"><button class="btn" onclick="cerrar()">Cerrar caja de este día</button></div>`}</div>
 ${wk?`<div class="card" style="margin-top:12px"><h2>Ventas por trabajador</h2><div class="wrap"><table><tr><th>Trabajador</th><th class="n">Servicios</th><th class="n">Ventas</th><th class="n">Pago</th></tr>${wk}</table></div></div>`:''}
 <div class="card" style="margin-top:12px"><h2>Movimientos del día</h2><div class="wrap"><table><tr><th>Hora</th><th>Tipo</th><th>Concepto</th><th>Trabajador</th><th>Bolsillo</th><th class="n">Total</th></tr>${x.map(t=>`<tr><td>${hora(t)}</td><td><span class="tag ${KINDS[t.kind][1]}">${KINDS[t.kind][0]}</span></td><td>${esc(t.cat)}${t.note?` <span class="mut">· ${esc(t.note)}</span>`:''}</td><td>${t.w!=null?esc(S.workers[t.w]):''}</td><td>${esc(pk(t.pm))}</td><td class="n ${KINDS[t.kind][1]}">${fmt(t.total)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Sin movimientos este día.</td></tr>'}</table></div></div>
 <div class="card" style="margin-top:12px"><h2>Historial de cierres</h2>${S.cierres.length?`<div class="row"><button class="btn g" onclick="bajarCierres()">Exportar cierres (CSV)</button></div><div class="wrap"><table><tr><th>Fecha</th><th class="n">Motos</th><th class="n">Entradas</th><th class="n">Salidas</th><th class="n">Neto</th><th class="n">Diferencia</th><th>Estado</th><th></th></tr>
 ${[...S.cierres].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,90).map(c=>{const q=quick(c.date),m=q.ing!==c.ing||q.sal!==c.sal||q.n!==c.n;return `<tr><td><b>${c.date}</b></td><td class="n">${c.motos}</td><td class="n in">${fmt(c.ing)}</td><td class="n out">${fmt(c.sal)}</td><td class="n">${fmt(c.neto)}</td><td class="n">${hasCont(c)?fmt(difC(c)):'—'}</td><td>${estado(c)}${m?' <span class="tag" style="color:var(--out)">Modificado</span>':''}</td><td><button class="btn g" style="padding:4px 10px" onclick="verDia('${c.date}')">Ver</button></td></tr>`}).join('')}</table></div>`:'<p class="mut">Aún no hay cierres. Cierra la caja de un día y quedará aquí.</p>'}</div>`;
}
function cerrar(){
 const d=cdia;if(S.cierres.some(c=>c.date==d))return alert('Ya hay un cierre para este día.');
 const r=resDia(d),esp={},cont={};
 POCK.forEach((p,k)=>{const o=r.f[p];esp[p]=o.ini+o.e-o.s+o.t;const v=$('#ct'+k).value;cont[p]=v===''?null:+v});
 S.cierres.push({id:Date.now(),date:d,ts:new Date().toISOString(),ing:r.ing,sal:r.sal,neto:r.neto,n:r.n,motos:r.motos,esp,cont,nota:$('#cnota').value.trim()});save();render();

function bajarCierres(){

 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain'}));a.download='lavadero-'+hoy+'.'+t;a.click();
}
function subir(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.tx||!d.cat)throw 0;if(await pedirClave('Restaurar el respaldo reemplaza todos los datos actuales')){S=Object.assign({lend:['Valentina','Iván'],cierres:[],wCfg:{},wOff:{},ins:[],rec:{},im:[],ini:{},pct:35,mem:[],workers:['Trabajador 1','Trabajador 2','Trabajador 3']},d);save();render()}}catch(e){alert('El archivo no es un respaldo válido.')}};r.readAsText(f)}

let modal='ctl',met='ventas';
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const short=v=>v>=1000?Math.round(v/1000)+'k':v;
function openM(w){modal=w;$('#dlg').showModal();drawM()}
function drawM(){$('#dt').textContent={ctl:'Control mensual',mem:'Membresías',ins:'Control de insumos'}[modal];$('#db').innerHTML=({ctl:control,mem:membresias,ins:insumosModal})[modal]()}
function val(t){return met=='ventas'?t.total:1}
function bars(lab,v,money){const mx=Math.max(1,...v);return `<div class="bars">${v.map((x,i)=>`<div class="b" title="${lab[i]}: ${money?fmt(x):x}"><span>${x?(money?short(x):x):''}</span><i class="${x==mx&&x>0?'top':''}" style="height:${x/mx*120}px"></i><em>${lab[i]}</em></div>`).join('')}</div>`}
function mejor(lab,v,money){const mx=Math.max(...v);return mx>0?`Mayor movimiento: <b>${lab[v.indexOf(mx)]}</b> (${money?fmt(mx):mx})`:'Sin datos en este mes.'}
function control(){
 const ms=[...new Set(S.tx.map(t=>t.date.slice(0,7)).concat($('#mes').value))].sort().reverse(),cur=$('#mes').value;
 const [y,mo]=cur.split('-').map(Number),nd=new Date(y,mo,0).getDate();
 const d=mes().filter(t=>met=='ventas'?t.kind=='servicio'||t.kind=='producto':t.kind=='servicio');
 const dm=Array(nd).fill(0),sem=Array(7).fill(0);
 d.forEach(t=>{dm[+t.date.slice(8,10)-1]+=val(t);sem[new Date(t.date+'T00:00').getDay()]+=val(t)});
 const order=[1,2,3,4,5,6,0],money=met=='ventas',sv=order.map(i=>sem[i]);
 return `<div class="wrap"><table><tr><th>Mes</th><th class="n">Ingresos</th><th class="n">Gastos</th><th class="n">Nómina</th><th class="n">Pago trab.</th><th class="n">Ganancia</th><th class="n">Clientes</th></tr>
 ${ms.map(m=>{const a=S.tx.filter(t=>t.date.startsWith(m)),u=gan(a,m+'-01',m+'-31');return `<tr class="clk ${m==cur?'sel':''}" onclick="$('#mes').value='${m}';render();drawM()"><td><b>${m}</b></td><td class="n in">${fmt(sum(a,['servicio','producto']))}</td><td class="n out">${fmt(sum(a,['gasto']))}</td><td class="n pay">${fmt(sum(a,['nomina']))}</td><td class="n pay">${fmt(com(a)+fijoEn(m+'-01',m+'-31'))}</td><td class="n" style="color:var(${u>=0?'--ok':'--out'})">${fmt(u)}</td><td class="n">${a.filter(t=>t.kind=='servicio').length}</td></tr>`}).join('')}</table></div>
 <p class="mut">Clientes = servicios registrados en el mes. Toca un mes para ver sus gráficas.</p>
 <div class="row"><button class="btn ${money?'':'g'}" onclick="met='ventas';drawM()">Ventas ($)</button><button class="btn ${money?'g':''}" onclick="met='clientes';drawM()">Flujo de clientes</button></div>
 <h2 style="margin-top:14px">Por día del mes · ${cur}</h2>${bars(dm.map((_,i)=>i+1),dm,money)}<p>${mejor(dm.map((_,i)=>'día '+(i+1)),dm,money)}</p>
 <h2>Por día de la semana</h2>${bars(order.map(i=>DIAS[i]),sv,money)}<p>${mejor(order.map(i=>DIAS[i]),sv,money)}</p>`;
}
function membresias(){
 return `<form onsubmit="event.preventDefault();addMem()"><label>Nombre completo<input id="mn" required maxlength="60"></label><label>Teléfono<input id="mt" type="tel" required></label><label>Correo<input id="mc" type="email"></label><label>Número de documento<input id="md" required></label><div class="full"><button class="btn">Guardar membresía</button></div></form>
 <h2 style="margin-top:16px">Clientes con membresía (${S.mem.length})</h2><input placeholder="Buscar por nombre, teléfono o documento" oninput="filtrar(this.value)" style="margin-bottom:8px">
 <div class="wrap"><table id="tm"><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Documento</th><th></th></tr>${S.mem.map(m=>`<tr data-s="${esc((m.name+m.phone+m.doc).toLowerCase())}"><td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td>${esc(m.email)}</td><td>${esc(m.doc)}</td><td><button class="x" aria-label="Eliminar" onclick="delMem(${m.id})">×</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Aún no hay membresías. Agrega la primera con el formulario.</td></tr>'}</table></div>`;
}
function addMem(){const doc=$('#md').value.trim();if(S.mem.some(m=>m.doc==doc))return alert('Ya existe una membresía con ese número de documento.');S.mem.push({id:Date.now(),name:$('#mn').value.trim(),phone:$('#mt').value.trim(),email:$('#mc').value.trim(),doc});save();drawM()}
async function delMem(id){if(!await pedirClave('Eliminar esta membresía'))return;S.mem=S.mem.filter(m=>m.id!=id);save();drawM()}
function filtrar(q){q=q.toLowerCase();document.querySelectorAll('#tm tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')}
render();initDB();
</script>
</body>
</html>
